name: CI 

on:                    
  pull_request:
    branches: [main, rc, prod]
  push:
    branches: [main]
  workflow_dispatch: # manual run from the Actions tab

permissions:                  
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


jobs:                         
  backend:    
    name: Backend checks              
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    # Not secrets: the settings require both, and alembic builds them too.
    env:
      TOKEN_SECRET_KEY: 4e6f742d612d7365637265742d63692d6f6e6c792d746f6b656e2d6b65792121
      MEDIA_PUBLIC_BASE_URL: https://media.example.com/ci
    # Database tests always hit a real PostgreSQL; the settings defaults point at this service.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: SonarQube Cloud uses git blame to tell new code from old.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        id: install
        run: uv sync --locked --no-build

      - name: Run lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run --locked --no-build ruff check .

      - name: Run format
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run --locked --no-build ruff format --check .

      - name: Run type check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run --locked --no-build mypy src tests

      - name: Run architecture linter
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run --locked --no-build lint-imports

      # Every migration must downgrade cleanly (ADR 5). `head`, not `heads`: a second head fails here.
      - name: Run migration round-trip
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          uv run --locked --no-build alembic upgrade head
          uv run --locked --no-build alembic downgrade base
          uv run --locked --no-build alembic upgrade head
          uv run --locked --no-build alembic check

      - name: Run tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run --locked --no-build pytest --cov=app --cov-report=xml

      # CI-based analysis replaces Automatic Analysis, which cannot import coverage. It reads
      # sonar-project.properties from the repository root and backend/coverage.xml from the step above.
      - name: Run SonarQube Cloud analysis
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}


