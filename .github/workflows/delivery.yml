name: Delivery

on:
  push:
    branches: [main, rc, prod]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Build image
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tree: ${{ steps.meta.outputs.tree }}
    steps:
      - uses: actions/checkout@v7

      - name: Compute image identity
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/backend" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for an existing image
        id: existing
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TREE: ${{ steps.meta.outputs.tree }}
        run: |
          if docker buildx imagetools inspect "$IMAGE:tree-$TREE" > /dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Buildx
        if: steps.existing.outputs.found != 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build
        if: steps.existing.outputs.found != 'true'
        uses: docker/build-push-action@v7
        with:
          context: backend
          load: true
          push: false
          tags: |
            ${{ steps.meta.outputs.image }}:tree-${{ steps.meta.outputs.tree }}
            ${{ steps.meta.outputs.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan with Trivy
        if: steps.existing.outputs.found != 'true'
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}:tree-${{ steps.meta.outputs.tree }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Push
        if: steps.existing.outputs.found != 'true'
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
        run: docker push --all-tags "$IMAGE"

      - name: Summary
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TREE: ${{ steps.meta.outputs.tree }}
          FOUND: ${{ steps.existing.outputs.found }}
        run: |
          digest=$(docker buildx imagetools inspect "$IMAGE:tree-$TREE" --format '{{json .Manifest.Digest}}' | tr -d '"')
          {
            echo "### Backend image"
            echo "- Tag: \`tree-$TREE\`"
            echo "- Digest: \`$digest\`"
            if [ "$FOUND" = "true" ]; then echo "- Reused an existing image"; else echo "- Built, scanned and pushed"; fi
          } >> "$GITHUB_STEP_SUMMARY"

  # CI reaches the VM only through the tailnet, as an ephemeral tag:ci node (ADR 2).
  # The server runs the deploy entrypoint for the key's target and verifies the commit (ADR 3).
  deploy-dev:
    name: Deploy dev
    needs: image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: dev
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    steps:
      - name: Join the tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          ping: ${{ vars.DEPLOY_HOST }}

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          TOKEN_SECRET_KEY: ${{ secrets.TOKEN_SECRET_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          MEDIA_PUBLIC_BASE_URL: ${{ vars.MEDIA_PUBLIC_BASE_URL }}
        run: |
          install -m 600 /dev/null ~/deploy_key
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/deploy_key
          # Secrets go over stdin, never argv: printf is a shell builtin, and deploy.sh writes stdin to the .env.
          # The server's host key changes with every VM replacement; the tailnet already authenticates the peer.
          out=$(printf 'POSTGRES_PASSWORD=%s\nEMAIL_USERNAME=%s\nEMAIL_PASSWORD=%s\nEMAIL_SENDER=%s\nTOKEN_SECRET_KEY=%s\nGOOGLE_CLIENT_ID=%s\nGOOGLE_CLIENT_SECRET=%s\nMEDIA_PUBLIC_BASE_URL=%s\n' \
            "$POSTGRES_PASSWORD" "$EMAIL_USERNAME" "$EMAIL_PASSWORD" "$EMAIL_SENDER" "$TOKEN_SECRET_KEY" \
            "$GOOGLE_CLIENT_ID" "$GOOGLE_CLIENT_SECRET" "$MEDIA_PUBLIC_BASE_URL" \
            | ssh -i ~/deploy_key -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new "deploy@$DEPLOY_HOST" "$GITHUB_SHA")
          echo "$out"
          echo "### Dev: $out" >> "$GITHUB_STEP_SUMMARY"

  deploy-platform:
    name: Deploy platform
    if: github.ref == 'refs/heads/prod'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: platform
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy-platform
      cancel-in-progress: false
    steps:
      - name: Join the tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          ping: ${{ vars.DEPLOY_HOST }}

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 600 /dev/null ~/deploy_key
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/deploy_key
          out=$(ssh -i ~/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new \
            "deploy@$DEPLOY_HOST" "$GITHUB_SHA" < /dev/null)
          echo "$out"
          echo "### Platform: $out" >> "$GITHUB_STEP_SUMMARY"
