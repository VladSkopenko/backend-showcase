name: Delivery

on:
  push:
    branches: [main, rc, prod]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Build image
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tree: ${{ steps.meta.outputs.tree }}
    steps:
      - uses: actions/checkout@v7

      - name: Compute image identity
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/backend" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for an existing image
        id: existing
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TREE: ${{ steps.meta.outputs.tree }}
        run: |
          if docker buildx imagetools inspect "$IMAGE:tree-$TREE" > /dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Buildx
        if: steps.existing.outputs.found != 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build
        if: steps.existing.outputs.found != 'true'
        uses: docker/build-push-action@v7
        with:
          context: backend
          load: true
          push: false
          tags: |
            ${{ steps.meta.outputs.image }}:tree-${{ steps.meta.outputs.tree }}
            ${{ steps.meta.outputs.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan with Trivy
        if: steps.existing.outputs.found != 'true'
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}:tree-${{ steps.meta.outputs.tree }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Push
        if: steps.existing.outputs.found != 'true'
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
        run: docker push --all-tags "$IMAGE"

      - name: Summary
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TREE: ${{ steps.meta.outputs.tree }}
          FOUND: ${{ steps.existing.outputs.found }}
        run: |
          digest=$(docker buildx imagetools inspect "$IMAGE:tree-$TREE" --format '{{json .Manifest.Digest}}' | tr -d '"')
          {
            echo "### Backend image"
            echo "- Tag: \`tree-$TREE\`"
            echo "- Digest: \`$digest\`"
            if [ "$FOUND" = "true" ]; then echo "- Reused an existing image"; else echo "- Built, scanned and pushed"; fi
          } >> "$GITHUB_STEP_SUMMARY"
