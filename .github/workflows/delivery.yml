name: Delivery

on:
  push:
    branches: [main, rc, prod]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Build image
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    # Only this job pushes to GHCR.
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tree: ${{ steps.meta.outputs.tree }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute image identity
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/backend" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for an existing image
        id: existing
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TREE: ${{ steps.meta.outputs.tree }}
        run: |
          if docker buildx imagetools inspect "$IMAGE:tree-$TREE" > /dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Buildx
        if: steps.existing.outputs.found != 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        if: steps.existing.outputs.found != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          load: true
          push: false
          tags: |
            ${{ steps.meta.outputs.image }}:tree-${{ steps.meta.outputs.tree }}
            ${{ steps.meta.outputs.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan with Trivy
        if: steps.existing.outputs.found != 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}:tree-${{ steps.meta.outputs.tree }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Push
        if: steps.existing.outputs.found != 'true'
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
        run: docker push --all-tags "$IMAGE"

      - name: Summary
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TREE: ${{ steps.meta.outputs.tree }}
          FOUND: ${{ steps.existing.outputs.found }}
        run: |
          digest=$(docker buildx imagetools inspect "$IMAGE:tree-$TREE" --format '{{json .Manifest.Digest}}' | tr -d '"')
          {
            echo "### Backend image"
            echo "- Tag: \`tree-$TREE\`"
            echo "- Digest: \`$digest\`"
            if [ "$FOUND" = "true" ]; then echo "- Reused an existing image"; else echo "- Built, scanned and pushed"; fi
          } >> "$GITHUB_STEP_SUMMARY"

  # CI reaches the VM only through the tailnet, as an ephemeral tag:ci node.
  # The server runs the deploy entrypoint for the key's target and verifies the commit.
  deploy-dev:
    name: Deploy dev
    needs: image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: dev
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    steps:
      - name: Join the tailnet
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          ping: ${{ vars.DEPLOY_HOST }}

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          TOKEN_SECRET_KEY: ${{ secrets.TOKEN_SECRET_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          MEDIA_PUBLIC_BASE_URL: ${{ vars.MEDIA_PUBLIC_BASE_URL }}
          # The assistant's model provider key; an unset secret is empty and the assistant routes answer 503.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # The postgres_exporter role's password (migration 0026); deploy.sh starts the exporter on dev.
          POSTGRES_EXPORTER_PASSWORD: ${{ secrets.POSTGRES_EXPORTER_PASSWORD }}
        run: |
          install -m 600 /dev/null ~/deploy_key
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/deploy_key
          # Secrets go over stdin, never argv: printf is a shell builtin, and deploy.sh writes stdin to the .env.
          # The server's host key changes with every VM replacement; the tailnet already authenticates the peer.
          out=$(printf 'POSTGRES_PASSWORD=%s\nEMAIL_USERNAME=%s\nEMAIL_PASSWORD=%s\nEMAIL_SENDER=%s\nTOKEN_SECRET_KEY=%s\nGOOGLE_CLIENT_ID=%s\nGOOGLE_CLIENT_SECRET=%s\nMEDIA_PUBLIC_BASE_URL=%s\nOPENAI_API_KEY=%s\nPOSTGRES_EXPORTER_PASSWORD=%s\n' \
            "$POSTGRES_PASSWORD" "$EMAIL_USERNAME" "$EMAIL_PASSWORD" "$EMAIL_SENDER" "$TOKEN_SECRET_KEY" \
            "$GOOGLE_CLIENT_ID" "$GOOGLE_CLIENT_SECRET" "$MEDIA_PUBLIC_BASE_URL" "$OPENAI_API_KEY" "$POSTGRES_EXPORTER_PASSWORD" \
            | ssh -i ~/deploy_key -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new "deploy@$DEPLOY_HOST" "$GITHUB_SHA")
          echo "$out"
          echo "### Dev: $out" >> "$GITHUB_STEP_SUMMARY"

  # The platform has no environments to promote between, so every push to main deploys it.
  # No path filter: its inputs also live outside deploy/platform/, and compose restarts only changed services.
  deploy-platform:
    name: Deploy platform
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: platform
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy-platform
      cancel-in-progress: false
    steps:
      - name: Join the tailnet
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          ping: ${{ vars.DEPLOY_HOST }}

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          # Stored by deploy/platform/secrets.sh; a new secret is added there, here and in printf below.
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
          N8N_ENCRYPTION_KEY: ${{ secrets.N8N_ENCRYPTION_KEY }}
          N8N_OWNER_EMAIL: ${{ secrets.N8N_OWNER_EMAIL }}
          N8N_OWNER_PASSWORD_HASH: ${{ secrets.N8N_OWNER_PASSWORD_HASH }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          GRAFANA_DB_PASSWORD: ${{ secrets.GRAFANA_DB_PASSWORD }}
          PLATFORM_HOST: ${{ vars.PLATFORM_HOST }}
        run: |
          install -m 600 /dev/null ~/deploy_key
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/deploy_key
          # Secrets go over stdin, never argv; deploy.sh writes stdin to /srv/platform/.env.
          # The bcrypt hash is single-quoted: unquoted, compose reads its $-separated parts as variables.
          # The Grafana admin password is typed by a person, so it is single-quoted too.
          out=$(printf "TS_AUTHKEY=%s\nN8N_ENCRYPTION_KEY=%s\nN8N_OWNER_EMAIL=%s\nN8N_OWNER_PASSWORD_HASH='%s'\nGRAFANA_ADMIN_PASSWORD='%s'\nGRAFANA_DB_PASSWORD=%s\nPLATFORM_HOST=%s\n" \
            "$TS_AUTHKEY" "$N8N_ENCRYPTION_KEY" "$N8N_OWNER_EMAIL" "$N8N_OWNER_PASSWORD_HASH" "$GRAFANA_ADMIN_PASSWORD" "$GRAFANA_DB_PASSWORD" "$PLATFORM_HOST" \
            | ssh -i ~/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new \
            "deploy@$DEPLOY_HOST" "$GITHUB_SHA")
          echo "$out"
          echo "### Platform: $out" >> "$GITHUB_STEP_SUMMARY"
