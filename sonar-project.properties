# SonarQube Cloud analysis, run from CI by SonarSource/sonarqube-scan-action.
# https://docs.sonarsource.com/sonarqube-cloud/analyzing-source-code/analysis-parameters/parameters-not-settable-in-ui
sonar.projectKey=VladSkopenko_backend-showcase
sonar.organization=vladskopenko

# Sources default to the whole repository, as under Automatic Analysis, so the workflows, the
# Dockerfile and the n8n code stay analyzed. Test files are picked out of the same tree; the
# scanner then excludes them from the sources, since a file cannot be both.
# https://docs.sonarsource.com/sonarqube-cloud/managing-your-projects/project-analysis/setting-analysis-scope/excluding-files-based-on-patterns
sonar.tests=.
sonar.test.inclusions=backend/tests/**,n8n/tests/**

# Cobertura XML written by pytest-cov in the CI test step, relative to the repository root.
# https://docs.sonarsource.com/sonarqube-cloud/enriching/test-coverage/python-test-coverage/
sonar.python.coverage.reportPaths=backend/coverage.xml

# CI measures coverage for the app package only (--cov=app). Tests load migrations through
# importlib, outside that package, so migrations never reach the report and read as 0% covered.
# https://docs.sonarsource.com/sonarqube-cloud/managing-your-projects/project-analysis/setting-analysis-scope/exclude-from-coverage-duplication
sonar.coverage.exclusions=backend/migrations/**
