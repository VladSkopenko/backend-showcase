<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Confirm your email</title>
</head>
<body style="margin:0; padding:0; background-color:#f4f5f7;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f4f5f7;">
    <tr>
      <td align="center" style="padding:32px 16px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:480px; background-color:#ffffff; border-radius:12px;">
          <tr>
            <td style="padding:40px 32px 8px 32px; font-family:Arial, Helvetica, sans-serif; color:#111827;">
              <h1 style="margin:0 0 16px 0; font-size:22px; line-height:30px; font-weight:bold;">Confirm your email</h1>
              <p style="margin:0 0 24px 0; font-size:16px; line-height:24px; color:#374151;">
                Hi {{ first_name }}, thanks for creating an account. Confirm your email to finish signing up.
              </p>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:0 32px 32px 32px;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td align="center" bgcolor="#2563eb" style="border-radius:8px;">
                    <a href="{{ confirm_url }}" target="_blank" style="display:inline-block; padding:14px 32px; font-family:Arial, Helvetica, sans-serif; font-size:16px; font-weight:bold; color:#ffffff; text-decoration:none; border-radius:8px;">Confirm email</a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding:0 32px; font-family:Arial, Helvetica, sans-serif; color:#6b7280; font-size:14px; line-height:20px;" align="center">
              Or enter this code on the confirmation screen:
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:12px 32px 32px 32px;">
              <div style="display:inline-block; padding:16px 24px; background-color:#f3f4f6; border-radius:8px; font-family:'Courier New', Courier, monospace; font-size:32px; line-height:40px; font-weight:bold; letter-spacing:8px; color:#111827;">{{ code }}</div>
            </td>
          </tr>
          <tr>
            <td style="padding:0 32px 40px 32px; font-family:Arial, Helvetica, sans-serif; color:#6b7280; font-size:13px; line-height:20px;">
              The code expires in {{ ttl_minutes }} minutes. If you did not create an account, you can ignore this email.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
