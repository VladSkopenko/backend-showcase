[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "aiosmtplib>=5.1.3",
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.0",
    "jinja2>=3.1.6",
    "pwdlib[argon2]>=0.3.1",
    "pydantic[email]>=2.14.1",
    "pydantic-settings>=2.16.2",
    "sqlalchemy[asyncio]>=2.1.8",
    "uvicorn>=0.54.0",
    "pyjwt>=2.15.1",
    "authlib>=1.9.5",
    "itsdangerous>=2.2.0",
    "httpx2>=2.16.0",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
# authlib ships no type information (no py.typed, no stubs package in use).
module = ["authlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]

# Import rules from docs/adr/0011-feature-sliced-backend-layout.md.
# `*` matches one module level, `**` any depth; a wildcard that matches nothing passes.
# A plain module name must exist, so packages not created yet use `.**`. When such a package
# appears, drop the `.**` so its own __init__ is checked too.
[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Feature layers: endpoints > services > repositories > models"
type = "layers"
containers = ["app.features.*", "app.features.core.*"]
layers = ["(endpoints)", "(services)", "(repositories)", "(models)"]

[[tool.importlinter.contracts]]
name = "Endpoints never import repositories or models"
type = "forbidden"
source_modules = ["app.features.*.endpoints", "app.features.core.*.endpoints"]
forbidden_modules = [
    "app.features.*.repositories",
    "app.features.*.models",
    "app.features.core.*.repositories",
    "app.features.core.*.models",
]
# endpoints -> services -> models is the allowed path; only direct imports are banned.
allow_indirect_imports = "true"

[[tool.importlinter.contracts]]
name = "Only endpoints import schemas"
type = "forbidden"
source_modules = [
    "app.features.*.services",
    "app.features.*.repositories",
    "app.features.*.models",
    "app.features.*.dto",
    "app.features.core.*.services",
    "app.features.core.*.repositories",
    "app.features.core.*.models",
    "app.features.core.*.dto",
]
forbidden_modules = ["app.features.*.schemas", "app.features.core.*.schemas"]

[[tool.importlinter.contracts]]
name = "Code below endpoints knows nothing about HTTP"
type = "forbidden"
source_modules = [
    "app.features.*.services",
    "app.features.*.repositories",
    "app.features.*.models",
    "app.features.*.dto",
    "app.features.*.enums",
    "app.features.core.*.services",
    "app.features.core.*.repositories",
    "app.features.core.*.models",
    "app.features.core.*.dto",
    "app.features.core.*.enums",
    "app.features.application_services.**",
    "app.infrastructure.background_tasks.**",
]
forbidden_modules = ["fastapi", "starlette"]

[[tool.importlinter.contracts]]
name = "Regular features are independent"
type = "independence"
modules = ["app.features.*"]
ignore_imports = [
    "app.features.** -> app.features.core.**",
    "app.features.** -> app.features.application_services.**",
    "app.features.application_services.** -> app.features.**",
    # `.**` matches only descendants, so the package roots need their own entries.
    "app.features.** -> app.features.core",
    "app.features.** -> app.features.application_services",
    "app.features.application_services -> app.features.**",
]
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
# app.features.* also matches app.features.core, so common may not import core features either.
name = "Common imports no features; core never imports regular features"
type = "forbidden"
source_modules = ["app.common", "app.features.core"]
forbidden_modules = ["app.features.*"]

[[tool.importlinter.contracts]]
name = "Only regular endpoints and background tasks call application services"
type = "protected"
protected_modules = ["app.features.application_services.**"]
allowed_importers = ["app.features.*.endpoints", "app.infrastructure.background_tasks.**"]

[[tool.importlinter.contracts]]
# Scripts run from a developer's machine with dev-only dependencies such as boto3; the runtime
# app must never import them. A module overlapping app.scripts (app.scripts itself) is skipped.
name = "Nothing in the app imports scripts"
type = "forbidden"
source_modules = ["app.*"]
forbidden_modules = ["app.scripts"]

[[tool.importlinter.contracts]]
# app.infrastructure.storage imports boto3, a dev-only dependency the runtime image lacks. The seed
# service's import sits under TYPE_CHECKING; import-linter still counts it (the default
# exclude_type_checking_imports = false), so that module is listed as an allowed importer.
name = "Only the menu seed imports the S3 storage"
type = "protected"
protected_modules = ["app.infrastructure.storage"]
allowed_importers = ["app.scripts.**", "app.features.core.menu.services.dish_seed_service"]

[dependency-groups]
dev = [
    "boto3>=1.43.126",
    "boto3-stubs[s3]>=1.43.126",
    "httpx2>=2.16.0",
    "import-linter>=2.15",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
