# Platform stack, deployed once and changed only by its own deploys (AD-1).
services:
  caddy:
    image: caddy:2.11
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # A directory, not the file: git replaces files on checkout, and a single-file mount would keep the old one.
      - ./caddy:/etc/caddy:ro
      # Certificates live on the data volume, so a VM replacement does not re-issue them (AD-11).
      - /srv/data/platform/caddy/data:/data
      - /srv/data/platform/caddy/config:/config
    networks:
      - edge

networks:
  edge:
    external: true
