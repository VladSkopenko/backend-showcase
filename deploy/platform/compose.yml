services:
  init:
    image: busybox:1.38.0@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
    restart: "no"
    mem_limit: 32m
    network_mode: none
    volumes:
      - /srv/data/platform:/data
    command:
      - sh
      - -euc
      - |
        install -d -o 0     -g 0     -m 700 /data/caddy/data /data/caddy/config
        install -d -o 0     -g 0     -m 700 /data/tailscale
        install -d -o 1000  -g 1000  -m 700 /data/n8n
        install -d -o 472   -g 0     -m 700 /data/grafana
        install -d -o 65534 -g 65534 -m 700 /data/prometheus
        install -d -o 0     -g 0     -m 700 /data/victorialogs
        install -d -o 0     -g 0     -m 700 /data/fluent-bit

  caddy:
    image: caddy:2.11@sha256:4851e54a46b206517c574821bb5cc67f170d2156041e9fbc4c9193b45e84a75b
    restart: unless-stopped
    mem_limit: 128m
    depends_on:
      init:
        condition: service_completed_successfully
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy:/etc/caddy:ro
      - /srv/data/platform/caddy/data:/data
      - /srv/data/platform/caddy/config:/config
    networks:
      - edge

  tailscale:
    image: tailscale/tailscale:v1.104.7@sha256:72c1e19e0aedca96b8533bbb0b4368564410ff20b17e53b804eb6c1f04a31be4
    restart: unless-stopped
    mem_limit: 128m
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?TS_AUTHKEY comes from the GitHub Environment}
      TS_EXTRA_ARGS: --advertise-tags=tag:platform
      TS_HOSTNAME: backend-showcase-platform
      TS_USERSPACE: "true"
      TS_STATE_DIR: /var/lib/tailscale
      TS_AUTH_ONCE: "true"
      TS_SERVE_CONFIG: /config/serve.json
      TS_ENABLE_HEALTH_CHECK: "true"
    volumes:
      - ./tailscale:/config:ro
      - /srv/data/platform/tailscale:/var/lib/tailscale
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9002/healthz"]
      interval: 10s
      timeout: 3s
      retries: 12
    depends_on:
      init:
        condition: service_completed_successfully

  n8n:
    image: n8nio/n8n:2.47.7@sha256:b4b90747b81fcda7e76550c0d3aa7f0f64917a1e9573cff40d6834eaf2e0f8ea
    restart: unless-stopped
    mem_limit: 768m
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY comes from the GitHub Environment}
      N8N_INSTANCE_OWNER_MANAGED_BY_ENV: "true"
      N8N_INSTANCE_OWNER_EMAIL: ${N8N_OWNER_EMAIL:?N8N_OWNER_EMAIL comes from the GitHub Environment}
      N8N_INSTANCE_OWNER_PASSWORD_HASH: ${N8N_OWNER_PASSWORD_HASH:?N8N_OWNER_PASSWORD_HASH comes from the GitHub Environment}
      N8N_INSTANCE_OWNER_FIRST_NAME: Vlad
      N8N_INSTANCE_OWNER_LAST_NAME: Skopenko
      N8N_HOST: ${PLATFORM_HOST:?PLATFORM_HOST comes from the GitHub Environment}
      N8N_PROTOCOL: https
      N8N_EDITOR_BASE_URL: https://${PLATFORM_HOST:?PLATFORM_HOST comes from the GitHub Environment}:5678
      N8N_PROXY_HOPS: "1"
      GENERIC_TIMEZONE: Asia/Tbilisi
      TZ: Asia/Tbilisi
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
    volumes:
      - /srv/data/platform/n8n:/home/node/.n8n
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5678/healthz/readiness"]
      interval: 10s
      timeout: 3s
      retries: 12
    depends_on:
      init:
        condition: service_completed_successfully

  grafana:
    image: grafana/grafana:13.2.6@sha256:b21409d7951ddcfd63a4b49083e4ef2cc35bc1437d071813bf82bfb238b00bca
    restart: unless-stopped
    mem_limit: 768m
    environment:
      GF_SERVER_ROOT_URL: https://backend-showcase-grafana.duckdns.org
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_ANONYMOUS_HIDE_VERSION: "true"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD comes from the GitHub Environment}
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_METRICS_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/bookings.json
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:?GRAFANA_DB_PASSWORD comes from the GitHub Environment}
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - /srv/data/platform/grafana:/var/lib/grafana
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 12
    depends_on:
      init:
        condition: service_completed_successfully
    networks:
      - edge
      - analytics-dev
      - observability

  prometheus:
    image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    restart: unless-stopped
    mem_limit: 512m
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --query.timeout=10s
      - --query.max-concurrency=4
      - --query.max-samples=1000000
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - /srv/data/platform/prometheus:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 12
    depends_on:
      init:
        condition: service_completed_successfully
    networks:
      - default
      - observability

  node-exporter:
    image: prom/node-exporter:v1.13.1@sha256:7296504d4ada44b7d7ab4431e27e9f9900d8488f8d55842f4b12ae2704e16dfe
    restart: unless-stopped
    mem_limit: 32m
    command:
      - --path.rootfs=/host
      - --collector.disable-defaults
      - --collector.cpu
      - --collector.meminfo
      - --collector.loadavg
      - --collector.filesystem
      - --collector.diskstats
      - --web.disable-exporter-metrics
    volumes:
      - /:/host:ro,rslave
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9100/"]
      interval: 10s
      timeout: 3s
      retries: 12
    networks:
      - observability

  victorialogs:
    image: victoriametrics/victoria-logs:v1.54.0@sha256:ee4e820cac3721f5f5d91641b950c22439593adc4224f9655e5333d5a84c1dfe
    restart: unless-stopped
    mem_limit: 256m
    command:
      - -storageDataPath=/victoria-logs-data
      - -retentionPeriod=7d
      - -retention.maxDiskSpaceUsageBytes=5GiB
    volumes:
      - /srv/data/platform/victorialogs:/victoria-logs-data
    healthcheck:
      test: ["CMD", "/victoria-logs-prod", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 12
    depends_on:
      init:
        condition: service_completed_successfully
    networks:
      - default
      - observability

  fluent-bit:
    image: fluent/fluent-bit:5.1.5@sha256:25435e66b8da34975a615979e1297163f93690011d4d1900b6fa542e84ffb35f
    restart: unless-stopped
    mem_limit: 64m
    entrypoint: ["/fluent-bit/bin/fluent-bit"]
    command: ["-c", "/fluent-bit/etc/fluent-bit.yaml"]
    volumes:
      - ./fluent-bit:/fluent-bit/etc:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /srv/data/platform/fluent-bit:/fluent-bit/state
    depends_on:
      init:
        condition: service_completed_successfully
      victorialogs:
        condition: service_healthy
    networks:
      - observability

networks:
  edge:
    external: true
  analytics-dev:
    external: true
  observability:
    external: true