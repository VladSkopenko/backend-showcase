# Grafana reads this on every start and makes the data source match it (ADR 15).
apiVersion: 1

datasources:
  # The API's request metrics. Anonymous Viewers can send any PromQL through it, so Prometheus
  # holds API counters only and limits every query (ADR 22).
  - name: API metrics (Prometheus)
    # Fixed, so the api dashboard provisioned from the repository can refer to it.
    uid: prometheus
    type: prometheus
    # Queries run from the Grafana server, never from the browser.
    access: proxy
    # Prometheus by its service name on the observability network.
    url: http://prometheus:9090
    jsonData:
      # Prometheus's scrape interval; $__rate_interval is never shorter than four of them.
      timeInterval: 15s
      # Grafana's recommended method; set explicitly, as in the dry run.
      httpMethod: POST
    # The dev database stays the default for Explore and new panels.
    isDefault: false
    # Changed only through this file.
    editable: false
