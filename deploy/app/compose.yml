# One compose file for every environment; only /srv/app/<env>/.env differs.
# deploy.sh runs it as project app-<env> and writes APP_ENV, IMAGE and the stdin secrets into that .env.
# That .env feeds interpolation only: a container gets a value only when it is declared under environment.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # On the project's default network and its own analytics network, never on edge.
  postgres:
    image: postgres:18
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 512m
    command: postgres -c shared_buffers=128MB
    environment:
      POSTGRES_USER: app
      POSTGRES_DB: app
      # Applies only to an empty data directory; a later change needs ALTER ROLE in the database.
      # Must be alphanumeric (openssl rand -hex 32): .env values are unquoted, so $, " #" or a newline get mangled.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD comes from the GitHub Environment}
    volumes:
      # PostgreSQL 18 keeps PGDATA under /var/lib/postgresql/18/docker; the data volume survives VM replacement.
      - /srv/data/${APP_ENV:?APP_ENV is written by deploy.sh}/postgres:/var/lib/postgresql
    healthcheck:
      # TCP, not the socket: during first init the temporary server listens only on the unix socket.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "app", "-d", "app"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      # Listing any network drops the implicit default, so it is named here: the API reaches postgres on it.
      default:
      # Grafana reads dev here as app-dev-postgres. On staging and prod nothing else joins yet.
      analytics:
        aliases:
          - app-${APP_ENV:?APP_ENV is written by deploy.sh}-postgres

  api:
    image: ${IMAGE:?IMAGE is written by deploy.sh}
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 256m
    environment:
      APP_ENVIRONMENT: ${APP_ENV:?APP_ENV is written by deploy.sh}
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD comes from the GitHub Environment}
      # Gmail SMTP from the GitHub Environment. Left empty, the API runs and logs an error per unsent email.
      EMAIL_USERNAME: ${EMAIL_USERNAME:-}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-}
      EMAIL_SENDER: ${EMAIL_SENDER:-}
      # Google sign-in from the GitHub Environment. Left empty, /api/v1/auth/google/* redirects with OAUTH_UNAVAILABLE.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Signs access tokens; the API refuses to start without it. Hex like POSTGRES_PASSWORD (openssl rand -hex 32).
      TOKEN_SECRET_KEY: ${TOKEN_SECRET_KEY:?TOKEN_SECRET_KEY comes from the GitHub Environment}
      # Public base URL of the environment's media bucket; a plain GitHub Environment variable, not a secret.
      # The API refuses to start without it. No write keys here: only the local seed uploads pictures.
      MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:?MEDIA_PUBLIC_BASE_URL comes from the GitHub Environment}
      # The assistant's OpenAI key from the GitHub Environment. Left empty, /api/v1/assistant/* answers 503.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      default:
      # Caddy and n8n reach each environment's API as app-<env>-api.
      edge:
        aliases:
          - app-${APP_ENV:?APP_ENV is written by deploy.sh}-api
      # Prometheus scrapes the metrics port as app-<env>-api:9000.
      observability:
        aliases:
          - app-${APP_ENV:?APP_ENV is written by deploy.sh}-api

  # Dev only: deploy.sh starts it after the API. Prometheus scrapes it as
  # app-<env>-postgres-exporter:9187; no published port, never on edge.
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.21.1
    restart: unless-stopped
    logging: *default-logging
    # Measured in a local dry run: about 11 MB.
    mem_limit: 32m
    command:
      # A flag, not DATA_SOURCE_URI: the variable is deprecated in 0.21 and removed in 0.22.
      - --datasource.uri=postgres:5432/app?sslmode=disable
      # The plain login role may not call pg_ls_waldir, so this collector would only fail.
      - --no-collector.wal
      # Anonymous Grafana Viewers can query every stored series: no server settings
      # and none of the exporter's own Go, process and build metrics.
      - --no-collector.settings
      - --web.disable-exporter-metrics
    environment:
      DATA_SOURCE_USER: postgres_exporter
      # Optional: compose interpolates every service, also the ones a deploy does not start.
      # Hex like POSTGRES_PASSWORD; the role's SCRAM verifier is in migration 0026.
      DATA_SOURCE_PASS: ${POSTGRES_EXPORTER_PASSWORD:-}
    healthcheck:
      # /metrics answers with pg_up 0 when the login fails, so reachability alone proves nothing.
      # Every check is a full scrape of the database, hence the long interval.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9187/metrics | grep -qx 'pg_up 1'"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      # Reaches postgres by service name here.
      default:
      observability:
        aliases:
          - app-${APP_ENV:?APP_ENV is written by deploy.sh}-postgres-exporter

networks:
  edge:
    external: true
  # One per environment, created as an internal network by the deploy scripts: compose rejects
  # every attribute except name on an external network, so "internal" cannot be declared here.
  analytics:
    name: analytics-${APP_ENV:?APP_ENV is written by deploy.sh}
    external: true
  # One network shared by every environment, created as an internal network by both deploy scripts.
  observability:
    external: true
