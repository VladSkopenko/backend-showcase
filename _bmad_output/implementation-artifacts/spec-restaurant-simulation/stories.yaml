- id: "1"
  title: Large-party booking requests
  description: >-
    Guests request bookings for 5 to 8 people; requests stay pending, do not hold the table and may
    compete (CAP-1). Instant bookings stay 1 to 4.
  spec_checkpoint: true
  done_checkpoint: true
